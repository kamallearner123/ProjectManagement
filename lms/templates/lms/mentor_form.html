{% extends 'base.html' %}
{% block content %}
<h2>{% if form.instance.pk %}Edit Mentor{% else %}Add Mentor{% endif %}</h2>
<form method="post" class="mt-3">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Save</button>
  <a href="{% url 'lms:mentor_list' %}" class="btn btn-link">Cancel</a>
</form>
{% endblock %}
