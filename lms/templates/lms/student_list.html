{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Students</h2>
  <a href="{% url 'lms:student_create' %}" class="btn btn-primary">Add Student</a>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Phone</th>
      <th>Mentor</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for s in students %}
    <tr>
      <td>{{ s.full_name }}</td>
      <td>{{ s.email }}</td>
      <td>{{ s.phone }}</td>
      <td>{{ s.mentor }}</td>
      <td><a href="{% url 'lms:student_edit' s.id %}" class="btn btn-sm btn-secondary">Edit</a></td>
    </tr>
    {% empty %}
    <tr><td colspan="5" class="text-center">No students yet.</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
